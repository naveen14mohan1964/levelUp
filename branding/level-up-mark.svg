<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Level Up">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1B33"/>
      <stop offset="1" stop-color="#0A1222"/>
    </linearGradient>
    <linearGradient id="rise" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#26324A" stroke-width="4"/>
  <!-- three ascending steps -->
  <rect x="112" y="300" width="76" height="100" rx="14" fill="url(#rise)" opacity="0.55"/>
  <rect x="218" y="236" width="76" height="164" rx="14" fill="url(#rise)" opacity="0.78"/>
  <rect x="324" y="172" width="76" height="228" rx="14" fill="url(#rise)"/>
  <!-- the climb: a line over the steps ending in an arrowhead -->
  <path d="M120 262 L238 190 L300 214 L392 128" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M352 112 L412 108 L408 168" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
